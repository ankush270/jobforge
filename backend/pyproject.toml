[project]
name = "jobforge"
version = "0.1.0"
description = "AI-powered job search command center"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Database
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",
    # Redis
    "redis>=5.0.0",
    # Auth
    "pyjwt>=2.8.0",
    "bcrypt>=4.1.0",
    "python-jose[cryptography]>=3.3.0",
    # Validation
    "pydantic[email]>=2.7.0",
    "pydantic-settings>=2.3.0",
    "email-validator>=2.0.0",
    # AI / LLM
    "litellm>=1.40.0",
    # Resume parsing
    "pypdf>=4.2.0",
    "python-docx>=1.1.0",
    # PDF generation
    "reportlab>=4.2.0",
    "playwright>=1.44.0",
    # Job scraping
    "python-jobspy>=1.1.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "celery[redis]>=5.4.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
