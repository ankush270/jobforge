services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: jobforge-db
    environment:
      POSTGRES_DB: jobforge
      POSTGRES_USER: jobforge
      POSTGRES_PASSWORD: jobforge_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobforge"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobforge-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobforge-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://jobforge:jobforge_dev_secret@postgres:5432/jobforge
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
      CORS_ORIGINS: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobforge-worker
    environment:
      DATABASE_URL: postgresql+asyncpg://jobforge:jobforge_dev_secret@postgres:5432/jobforge
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - uploads:/app/uploads
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2

  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: jobforge-scheduler
    environment:
      DATABASE_URL: postgresql+asyncpg://jobforge:jobforge_dev_secret@postgres:5432/jobforge
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: dev-secret-change-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: celery -A app.workers.celery_app beat --loglevel=info

volumes:
  pgdata:
  redisdata:
  uploads:
